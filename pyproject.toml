[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "backend-starter"
version = "0.1.0"
description = "Reusable FastAPI backend based on Clean and Hexagonal Architecture"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]


[project.optional-dependencies]
dev = [
    "httpx2>=2.0,<3.0",
    "pytest>=8,<10",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
